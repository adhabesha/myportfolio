<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portfolio | Addis Alemayehu</title><style>
/* IMAGES: drop files into an /images folder using the names shown in each grey placeholder.
   Until a file exists, the placeholder shows its file name and pixel size. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#333;--mute:#777;--line:#d9d9d9;--bg:#fafafa}
html{scroll-behavior:smooth}
body{font:300 17px/1.5 Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img{display:block;max-width:100%;height:auto}
:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.wrap{max-width:1050px;margin:0 auto;padding:0 20px}

/* header */
header{background:#000;color:#fff;height:94px}
header .wrap{max-width:1140px;height:100%;display:flex;align-items:center;justify-content:space-between}
.logo img,.logo .ph{width:64px;height:64px;border-radius:50%}
#menu{display:flex;align-items:center;gap:60px}
#menu nav{display:flex;gap:36px;font-size:16px}
#menu nav a:hover{opacity:.7}
.social{display:flex;gap:26px}
.social svg{width:28px;height:28px;fill:#fff;display:block}
.social a:hover{opacity:.7}
#burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer}
#burger span{display:block;width:26px;height:2px;background:#fff;margin:6px auto}

/* hero */
.hero{background:#fff;border-bottom:1px solid #e5e5e5;overflow:hidden}
.hero-in{max-width:1050px;margin:0 auto;position:relative}
.hero-in>img,.hero-in>.ph{width:100%;aspect-ratio:1040/600}
.hero h2{font-size:clamp(40px,6vw,66px);font-weight:500;letter-spacing:-.04em;line-height:1}
.hero p{font-size:18px;color:var(--mute);margin-top:14px}
.hero .side{position:absolute;top:36%;max-width:300px;padding:0 20px}
.hero .l{left:0}
.hero .r{right:0;text-align:right}

/* sections */
.work{background:var(--bg);padding:70px 0 90px}
.title{display:flex;align-items:center;gap:28px;margin-bottom:34px}
.title::before,.title::after{content:"";flex:1;height:1px;background:#ccc}
.title h2{font-size:15px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#444;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{display:block;background:#fff;border-radius:8px;padding:10px 10px 18px;box-shadow:0 1px 5px rgba(0,0,0,.22);transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.25)}
.thumb{background:#f1f3f6;border-radius:6px;overflow:hidden;margin-bottom:18px}
.card h3{font-size:18px;font-weight:300;padding:0 14px}

/* video slider */
.videos{background:#0f1b1a;color:#fff;padding:22px 0 34px}
.videos h2{font-size:15px;font-weight:500;margin-bottom:16px}
.vwrap{position:relative}
.track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.track::-webkit-scrollbar{display:none}
.vid{flex:0 0 calc((100% - 40px)/3);scroll-snap-align:start}
.vthumb{position:relative;border-radius:4px;overflow:hidden;background:#1d2b2a}
.vid p{font-size:14px;margin-top:8px;color:#d6dedd}
.play{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35)}
.play::after{content:"";position:absolute;left:18px;top:13px;border:9px solid transparent;border-left:14px solid #fff}
.dur{position:absolute;right:8px;bottom:6px;font-size:12px;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:3px}
.arrow{position:absolute;top:34%;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#000;font-size:22px;cursor:pointer}
.arrow.p{left:-10px}.arrow.n{right:-10px}

/* footer */
footer{background:#f5f5f5;border-top:1px solid #e3e3e3;position:relative;padding:34px 0;font-size:15px;color:var(--mute)}
footer .wrap{max-width:1140px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer nav{display:flex;gap:24px}
.top{position:absolute;left:50%;top:-60px;width:120px;height:60px;margin-left:-60px;background:#f5f5f5;border:1px solid #e3e3e3;border-bottom:0;border-radius:60px 60px 0 0}
.top::after{content:"";position:absolute;left:50%;top:26px;width:20px;height:20px;margin-left:-10px;border-left:2px solid #bbb;border-top:2px solid #bbb;transform:rotate(45deg) scale(.8)}

/* image placeholder */
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;background:repeating-linear-gradient(45deg,#eceff3,#eceff3 12px,#e4e8ed 12px,#e4e8ed 24px);border:2px dashed #aab2bd;color:#4a5560;font:500 14px/1.3 Roboto,sans-serif;text-align:center;padding:10px}
.ph b{font-size:18px}.ph small{font-size:12px;font-weight:400}
.vthumb .ph{border:0}

/* tablet + mobile */
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .vid{flex-basis:calc((100% - 20px)/2)}
  #burger{display:block}
  #menu{display:none;position:absolute;top:94px;left:0;right:0;z-index:5;background:#000;flex-direction:column;align-items:flex-start;gap:20px;padding:10px 24px 26px;border-top:1px solid #222}
  #menu.open{display:flex}
  #menu nav{flex-direction:column;gap:14px;font-size:18px}
  header{position:relative}
  .hero .side{position:static;max-width:none;padding:0 20px 28px}
  .hero .r{text-align:left}
  .hero-in>img,.hero-in>.ph{aspect-ratio:1040/600}
  .hero h2{font-size:44px}
}
@media(max-width:600px){
  header{height:76px}#menu{top:76px}
  .logo img,.logo .ph{width:52px;height:52px}
  .grid{grid-template-columns:1fr;gap:22px}
  .vid{flex-basis:82%}
  .arrow{display:none}
  .work{padding:50px 0 70px}
  .title{gap:14px}.title h2{font-size:13px;letter-spacing:.1em}
  footer .wrap{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}

.cs{background:#fff;padding:36px 0 90px}
.crumb{font-size:15px;color:var(--mute);margin-bottom:26px}.crumb a{text-decoration:underline}
.cs h1{font-size:clamp(30px,5vw,48px);font-weight:500;letter-spacing:-.02em;line-height:1.15}
.meta{color:var(--mute);margin:8px 0 22px}
.lead{font-size:20px;max-width:720px;margin-bottom:34px}
.cs .txt{max-width:720px;margin:44px auto 0}
.cs .txt h2{font-size:28px;font-weight:500;margin-bottom:14px;letter-spacing:-.01em}
.cs .txt p{margin-bottom:14px}
.shot{margin:34px 0}.shot img,.shot .ph,.video{border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.18)}
.video{position:relative;aspect-ratio:16/9;overflow:hidden;margin:34px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.more{margin-top:70px}
.pn{display:flex;justify-content:space-between;gap:16px;margin-top:50px}.pn a{text-decoration:underline}
</style><script>
/* Swap a missing image for a labelled placeholder showing the size to export */
function ph(img){
  var d=document.createElement('div');
  d.className='ph';
  d.style.aspectRatio=img.getAttribute('width')+'/'+img.getAttribute('height');
  d.innerHTML='<b>'+img.getAttribute('width')+' × '+img.getAttribute('height')+' px</b><span>'+img.getAttribute('alt')+'</span><small>'+img.getAttribute('src')+'</small>';
  img.onerror=null;img.replaceWith(d);
}
</script><link rel="preload" href="fonts/metropolis-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="theme.css"><script src="theme.js" defer></script><link rel="stylesheet" href="slider.css"><script src="slider.js" defer></script></head><body id="top"><header>
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Home"><img src="images/logo.png" width="128" height="128" alt="Logo" onerror="ph(this)"></a>
    <button id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
    <div id="menu">
      <nav aria-label="Main">
        <a href="index.html">home</a><a href="index.html#previous">portfolio</a><a href="about.html">about</a><a href="contact.html">contact</a>
      </nav>
      <div class="social">
        <a href="https://web.facebook.com/sikettc" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M13.5 21v-8h2.7l.4-3.2h-3.1V7.8c0-.9.3-1.5 1.6-1.5h1.7V3.4c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.2v2.3H7.5V13h2.8v8z"/></svg></a>
        <a href="https://www.linkedin.com/in/aceaddiss/" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M6.9 8.9H3.7V20h3.2zM5.3 3.5a1.9 1.9 0 100 3.8 1.9 1.9 0 000-3.8zM20.3 20v-6.100c0-3-1.600-4.400-3.800-4.400-1.700 0-2.500.9-2.900 1.600V8.900h-3.200V20h3.200v-6.200c0-.3 0-.7.100-.9.300-.7.900-1.400 2-1.400 1.400 0 1.900 1 1.900 2.600V20z"/></svg></a>
        <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3.500" y="3.500" width="17" height="17" rx="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17" cy="7" r="1.200"/></svg></a>
        <a href="https://www.youtube.com/@addisinfolinked" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M21.600 7.200a2.500 2.500 0 00-1.800-1.800C18.200 5 12 5 12 5s-6.200 0-7.800.4A2.500 2.500 0 002.400 7.200C2 8.800 2 12 2 12s0 3.200.4 4.800a2.500 2.500 0 001.800 1.800C5.800 19 12 19 12 19s6.200 0 7.800-.4a2.500 2.500 0 001.800-1.800C22 15.200 22 12 22 12s0-3.200-.4-4.800zM10 15V9l5.200 3z"/></svg></a>
      </div>
    </div>
  </div>
</header><div id="hs"></div><main class="work cs"><div class="wrap" id="main"></div></main><footer id="contact">
  <a class="top" href="#top" aria-label="Back to top"></a>
  <div class="wrap">
    <span>&copy; 2026 Addis Alemayehu</span>
    <nav aria-label="Footer"><a href="index.html">home</a><a href="index.html#previous">portfolio</a><a href="about.html">about</a><a href="contact.html">contact</a></nav>

</footer><script>
var b=document.getElementById('burger'),m=document.getElementById('menu');
b.onclick=function(){var o=m.classList.toggle('open');b.setAttribute('aria-expanded',o)};
m.addEventListener('click',function(e){if(e.target.closest('nav a')){m.classList.remove('open');b.setAttribute('aria-expanded',false)}});
var t=document.getElementById('track');
(document.querySelector('.arrow.n')||{}).onclick=function(){t.scrollBy({left:t.clientWidth*.8})};
(document.querySelector('.arrow.p')||{}).onclick=function(){t.scrollBy({left:-t.clientWidth*.8})};
</script><script>
var E=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')};
var IMG=function(src,w,h,alt){return '<img src="'+E(src)+'" width="'+w+'" height="'+h+'" alt="'+E(alt)+'" onerror="ph(this)">'};
var SEC=[{heading:'The challenge',text:'Describe the brief, the client and the problem you were solving.'},{heading:'The process',text:'Explain your approach, sketches, research and key decisions.'},{heading:'The result',text:'Show the final outcome and what it achieved.'}];
var main=document.getElementById('main');
fetch('data.json').then(function(r){return r.json()}).then(function(D){
  var q=new URLSearchParams(location.search),cat=D.categories.find(function(c){return c.id===q.get('c')}),n=+q.get('p')||0;
  if(!cat){main.innerHTML='<h1>Page not found</h1><p><a href="index.html">Back to home</a></p>';return}
  var base=function(i){return 'images/'+cat.id+'/'+i+'-'};
  var card=function(p,i){return '<li><a class="card" href="page.html?c='+cat.id+'&amp;p='+(i+1)+'"><div class="thumb">'+IMG(p.cover||base(i+1)+'cover.jpg',1600,900,p.title)+'</div><h3>'+E(p.title)+'</h3></a></li>'};
  var h='';
  if(!n||!cat.projects[n-1]){
    document.title=cat.title+' | Addis Alemayehu';
    h='<h1>'+E(cat.title)+'</h1><p class="lead" style="margin-top:14px">'+E(cat.description)+'</p><ul class="grid">'+cat.projects.map(card).join('')+'</ul>';
  }else{
    var p=cat.projects[n-1],b=base(n),g=p.gallery==null?3:p.gallery,s=p.sections||SEC,G=p.images||Array.from({length:g},function(_,i){return b+(i+1)+'.jpg'}),L=Math.max(s.length,G.length);
    document.title=p.title+' | Addis Alemayehu';
    h='<div class="pintro"><div class="rl"><h1>'+E(p.title)+'</h1><p class="meta">'+E(p.client||'Client name')+' &middot; '+E(p.date||'Month Year')+'</p><p class="lead">'+E(p.summary||'A short summary of this project: the goal, your role and the result.')+'</p></div>';
    h+='<div class="rr">'+(p.video?'<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/'+E(p.video)+'" title="'+E(p.title)+'" allowfullscreen loading="lazy"></iframe></div>':'<div class="shot">'+IMG(p.cover||b+'cover.jpg',1600,900,p.title+' cover')+'</div>')+'</div></div>';
    var M=function(x,k){return x.indexOf('sl:')==0?'<div class="cfslot" data-slider="'+E(x.slice(3))+'"></div>':x.indexOf('yt:')==0?'<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/'+E(x.slice(3))+'" title="'+E(p.title)+'" allowfullscreen loading="lazy"></iframe></div>':'<div class="shot">'+IMG(x,1600,900,p.title+' image '+(k+1))+'</div>'},T=function(x){return '<div class="txt"><h2>'+E(x.heading)+'</h2>'+E(x.text).split(/\n+/).map(function(t){return '<p>'+t+'</p>'}).join('')+'</div>'};
    if(s.some(function(x){return x.media})){s.forEach(function(x){var md=(x.media||[]).map(M).join('');if(x.layout==='l'||x.layout==='r'){var f=x.layout==='r';h+='<div class="sd'+(f?' flip':'')+'"><div class="'+(f?'rr':'rl')+'">'+T(x)+'</div><div class="'+(f?'rl':'rr')+'">'+md+'</div></div>'}else h+=T(x)+md});h+=(p.images||[]).map(M).join('')}
    else for(var i=0;i<L;i++){if(s[i])h+=T(s[i]);if(G[i])h+=M(G[i],i)}
    var o=cat.projects.map(function(x,i){return card(x,i)}).filter(function(_,i){return i!==n-1});
    if(o.length)h+='<div class="more"><div class="title"><h2>More from '+E(cat.title)+'</h2></div><ul class="grid">'+o.join('')+'</ul></div>';
    var pv=cat.projects[n-2],nx=cat.projects[n];
    h+='<div class="pn"><span>'+(pv?'<a href="page.html?c='+cat.id+'&amp;p='+(n-1)+'">&larr; '+E(pv.title)+'</a>':'')+'</span><span>'+(nx?'<a href="page.html?c='+cat.id+'&amp;p='+(n+1)+'">'+E(nx.title)+' &rarr;</a>':'')+'</span></div>';
  }
  main.innerHTML=h;var hd=((n&&cat.projects[n-1])||{}).header||cat.header;document.getElementById('hs').innerHTML=hd?'<div data-slider="'+E(hd)+'" data-full="1"></div>':'';if(window.CF)CF.mount(D);
}).catch(function(){main.innerHTML='<h1>Could not load data.json</h1><p>Open the site through a web server (or the live Cloudflare address), not by double-clicking the file.</p>'});
</script></body></html>
