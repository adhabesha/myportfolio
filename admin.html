<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Portfolio admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:#222;background:#f4f5f7}
button,.btn{font:inherit;padding:6px 11px;border:1px solid #c8ccd2;background:#fff;border-radius:6px;cursor:pointer;color:#222}
button:hover,.btn:hover{background:#eef0f3}.pri{background:#111;color:#fff;border-color:#111}.pri:hover{background:#333}.dng{color:#b00020}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid #ddd;padding:10px 16px}
.bar b{margin-right:8px}#st{flex:1;font-size:13px;color:#555;min-width:120px}
input,textarea,select{width:100%;font:inherit;padding:8px 10px;border:1px solid #c8ccd2;border-radius:6px;background:#fff}
.bar input{width:150px}
.app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 56px)}
aside{background:#fff;border-right:1px solid #ddd;padding:12px;overflow:auto}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666;display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}
aside h3 button{font-size:12px;padding:2px 8px}
.cat,.prj{padding:6px 10px;border-radius:6px;cursor:pointer}.cat{font-weight:600;margin-top:6px}.prj{margin-left:14px;font-size:14px}
.cat:hover,.prj:hover{background:#eef0f3}.on{background:#e3ecff!important}
.prow{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px}.prow:hover{background:#eef0f3}.prow span{flex:1;cursor:pointer}.prow button{padding:2px 9px}
#pk{width:min(940px,96vw);max-height:90vh}.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:56vh;overflow:auto;margin:10px 0}.lib label{position:relative;display:block;border:2px solid transparent;border-radius:6px;cursor:pointer;background:#eef0f3;overflow:hidden;font-size:11px}.lib label.on{border-color:#2563eb}.lib img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.lib input{position:absolute;top:6px;left:6px;width:auto}.lib i{display:block;padding:3px 6px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plist{max-height:56vh;overflow:auto;margin:10px 0}.plist label{display:flex;gap:10px;align-items:center;padding:6px 8px;border-bottom:1px solid #e5e8ec;cursor:pointer}.plist input{width:auto}.plist small{color:#778}
main{padding:20px;max-width:900px;width:100%}
label{display:block;font-weight:500;margin:14px 0 0}label>*{margin-top:5px;font-weight:400}
.tb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sp{flex:1}.tb a{margin-left:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0;display:grid;gap:6px}
.box>div:last-child{display:flex;gap:6px}.lc{margin:14px 0 0}.lc b{font-weight:500;display:block;margin-bottom:5px}
.cov{display:flex;gap:14px;align-items:center}.cov img{width:200px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#ddd}.cov span{width:200px;aspect-ratio:16/9;display:grid;place-items:center;background:#e4e7eb;color:#777;border-radius:6px}.cov div{display:grid;gap:6px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
figure{margin:0;background:#fff;border:1px solid #ddd;border-radius:8px;padding:6px;position:relative}figure img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px}
figure div{display:flex;gap:4px;margin-top:6px}figure button{padding:2px 8px}figure i{position:absolute;left:10px;top:10px;background:#000a;color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;font-style:normal}
.drop{border:2px dashed #aab2bd;border-radius:8px;padding:18px;text-align:center;color:#555;background:#fff}.drop.over{background:#e3ecff}
h4{margin:24px 0 6px;display:flex;justify-content:space-between;align-items:center}.hint{color:#666}
dialog{border:0;border-radius:10px;padding:22px;width:min(480px,92vw);box-shadow:0 10px 40px #0005}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd;max-height:40vh}.two{grid-template-columns:1fr}}
.slfig{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;background:#2b2e33;color:#fff;border-radius:4px;font-size:13px;padding:6px}figure input{padding:4px 6px;margin-top:6px}.slot{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0}.chip{display:inline-flex;gap:6px;align-items:center;background:#e3ecff;border-radius:14px;padding:2px 4px 2px 10px;margin:2px 4px 2px 0}.chip button{padding:0 7px;border:0;background:none;font-size:15px}.slot .tb{margin-top:6px}</style></head><body>
<div class="bar"><b>Portfolio admin</b><input id="flt" name="project-filter" placeholder="Filter projects…" autocomplete="off" spellcheck="false"><span id="st"></span>
<button id="ex">Export</button><label class="btn" style="margin:0">Import<input type="file" id="im" accept=".json" hidden></label>
<button id="cfgb">Settings</button><button id="pb" class="pri">Publish</button></div>
<div class="app"><aside id="tree"></aside><main id="ed"></main></div>

<dialog id="dlg"><h3 style="margin-top:0">Connect to GitHub</h3>
<p class="hint">Create a token at github.com/settings/personal-access-tokens/new : pick only the <b>myportfolio</b> repository and set <b>Contents: Read and write</b>. It is stored only in this browser.</p>
<label>Repository<input id="rp" autocomplete="off"></label><label>Branch<input id="br" autocomplete="off"></label><label>Token<input id="tk" type="password" autocomplete="new-password" placeholder="github_pat_…"></label>
<p class="tb"><span class="sp"></span><button id="cx">Cancel</button><button id="cs" class="pri">Save &amp; load</button></p></dialog>
<input type="file" id="fm" multiple accept="image/*" hidden><input type="file" id="fc" accept="image/*" hidden>
<link rel="stylesheet" href="slider.css"><script src="slider.js"></script><script src="defaults.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let D={categories:[]},sel={c:-1,p:-1},pend={},dirty=0,covT='c',covI=0,fmMode='m',fmIdx=0,cfg=JSON.parse(localStorage.cfg||'{"repo":"adhabesha/myportfolio","branch":"main","token":""}');
const G=[['previous','Previous work'],['industry','Sample work by industry']],C=()=>D.categories[sel.c],P=()=>C()&&C().projects[sel.p];
const msg=(t,bad)=>{$('#st').textContent=t;$('#st').style.color=bad?'#c00':'#555'};
const touch=()=>{dirty=1;localStorage.draft=JSON.stringify(D);msg('Unpublished changes (draft saved in this browser)')};
const slug=(t,ex)=>{let b=t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item',s=b,i=2;while(D.categories.some(c=>c.id===s&&c!==ex))s=b+'-'+i++;return s};
const ytid=u=>{const m=String(u||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||String(u||'').match(/^([\w-]{11})$/);return m&&m[1]};
const src=p=>pend[p]?pend[p].url:p;
const rd=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(b)});
const mv=(a,i,d,ok=()=>1)=>{let j=i+d;while(a[j]&&!ok(a[j]))j+=d;if(a[j]){[a[i],a[j]]=[a[j],a[i]];return j}return i};
const fp=id=>{for(const c of D.categories){const i=c.projects.findIndex(p=>p.id===id);if(i>=0)return{c,p:c.projects[i],i}}return null};
const unref=ids=>D.categories.forEach(c=>c.projects=c.projects.filter(p=>!(p.ref&&ids.includes(p.ref))));
const NP=t=>({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:t,client:'',date:'',summary:'',sections:[],images:[]});
const done=()=>{touch();tree();edit()};


const defSite=()=>({logo:'',social:{facebook:'https://web.facebook.com/sikettc',linkedin:'https://www.linkedin.com/in/aceaddiss/',instagram:'#',youtube:'https://www.youtube.com/@addisinfolinked'},footer:'© 2026 Addis Alemayehu',
hero:{image:'',left:{title:'designer',text:'Experienced in graphic & web design, creating websites, user interfaces, brands, logos and print media.'},right:{title:'<coder>',text:'Skilled in front-end web development: HTML, CSS, JavaScript, WordPress, PHP and SEO.'}},
titles:{previous:'Previous work',videos:'Motion Graphics Designs',industry:'Sample work by industries'},
videos:[['Aims healthcare draft','00:59'],['International courses AI voice over','00:46'],['Meri Coffee 2','00:32'],['Wave club advert','01:12']].map((v,i)=>({title:v[0],duration:v[1],image:'images/video-'+(i+1)+'.jpg'})).concat([['Siket training center short term courses','01:11','sIWo3DbTRPQ'],['Siket training center WAs','01:05','RB1PprnVM3Q'],['Siket training center safety courses','00:46','5MlL8NSkM10'],['Siket training center degree courses WA','01:01','_LYk2-1UnnM']].map(v=>({title:v[0],duration:v[1],yt:v[2]})))});
function mig(){D.site=D.site||defSite();D.categories.forEach(c=>c.projects.forEach(p=>{if(!p.ref&&!p.id)p.id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}));D.sliders=D.sliders||[];D.site.slots=D.site.slots||{};D.site.about=D.site.about||JSON.parse(JSON.stringify(DEF.about));D.site.contact=D.site.contact||JSON.parse(JSON.stringify(DEF.contact));D.categories.forEach(c=>c.projects.forEach(p=>{if(!p.sections)return;
if(!p.sections.some(x=>x.media)&&p.images&&p.images.length&&p.sections.length){p.sections.forEach(x=>x.media=[]);p.images.forEach((m,i)=>p.sections[Math.min(i,p.sections.length-1)].media.push(m));p.images=[]}
else p.sections.forEach(x=>x.media=x.media||[])}))}
const mb=(l,mode,i)=>{const sm=mode==='sm',a=mode+'mv',d=mode+'del';return `<div class="media">${(l||[]).map((m,k)=>`<figure>${m.startsWith('sl:')?`<div class="slfig">▦ Slider<br>${E(((D.sliders||[]).find(s=>s.id===m.slice(3))||{}).name||'(deleted)')}</div>`:m.startsWith('yt:')?`<img src="https://i.ytimg.com/vi/${E(m.slice(3))}/mqdefault.jpg"><i>YouTube</i>`:`<img src="${E(src(m))}">`}<div><button data-a="${a}" data-s="${i}" data-i="${k}" data-d="-1">←</button><button data-a="${a}" data-s="${i}" data-i="${k}" data-d="1">→</button><button data-a="${d}" data-s="${i}" data-i="${k}" class="dng">✕</button></div></figure>`).join('')}</div><div class="drop" data-mode="${mode}" data-i="${i}">Drop images or GIFs here, or <button data-a="addmedia" data-mode="${mode}" data-i="${i}">Choose files</button> <button data-a="lib" data-mode="${mode}" data-i="${i}">From library</button> ${mode==='ap'?'':`<button data-a="ytadd" data-mode="${mode}" data-i="${i}">+ YouTube video</button><button data-a="slpick" data-mode="${mode}" data-i="${i}">+ Slider</button>`}</div>`};
const bindDrops=()=>document.querySelectorAll('.drop').forEach(d=>{d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');add(e.dataTransfer.files,d.dataset.mode,+d.dataset.i)}});
function home(){if(!D.site)D.site=defSite();const s=D.site,I=(k,v,ph='')=>`<input data-b="${k}" value="${E(v)}" placeholder="${ph}">`,T=(k,v)=>`<textarea data-b="${k}" rows="3">${E(v)}</textarea>`,L=(t,x)=>`<label>${t}${x}</label>`,
Lc=(t,x)=>`<div class="lc"><b>${t}</b>${x}</div>`,img=(path,t,i=0)=>`<div class="cov">${path?`<img src="${E(src(path))}" style="object-fit:contain">`:'<span>Default / none</span>'}<div><button data-a="cov" data-t="${t}" data-i="${i}">Upload image</button><button data-a="lib" data-mode="${t}" data-i="${i}">From library</button>${path?`<button data-a="covx" data-t="${t}" data-i="${i}">Remove</button>`:''}</div></div>`;
$('#ed').innerHTML=`<div class="tb"><b>Home page</b><span class="sp"></span><a href="index.html" target="_blank">Preview live</a></div><p class="hint">Home cards: edit each category's name and image from the list on the left. They appear in the same order.</p>`
+`<h4>Header &amp; footer</h4>`+Lc('Logo (square PNG, 128×128 or larger)',img(s.logo,'logo'))+`<div class="two">`+L('Facebook link',I('s.social.facebook',s.social.facebook))+L('LinkedIn link',I('s.social.linkedin',s.social.linkedin))+L('Instagram link',I('s.social.instagram',s.social.instagram))+L('YouTube link',I('s.social.youtube',s.social.youtube))+`</div>`+L('Footer text',I('s.footer',s.footer))
+`<label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" data-b="s.hideHero" style="width:auto"${s.hideHero?' checked':''}> Hide the hero photo section (for example when a header slider replaces it)</label>`+`<h4>Hero</h4>`+Lc('Hero image (a wide photo or a transparent PNG, about 1600×800)',img(s.hero.image,'hero'))+`<div class="two">`+L('Left heading',I('s.hero.left.title',s.hero.left.title))+L('Right heading',I('s.hero.right.title',s.hero.right.title))+L('Left text',T('s.hero.left.text',s.hero.left.text))+L('Right text',T('s.hero.right.text',s.hero.right.text))+`</div>`
+`<h4>Section titles</h4><div class="two">`+L('Previous work',I('s.titles.previous',s.titles.previous))+L('Video slider',I('s.titles.videos',s.titles.videos))+L('Industries',I('s.titles.industry',s.titles.industry))+`</div>`
+`<h4>Motion graphics video slider<button data-a="vadd">+ Video</button></h4>`+s.videos.map((v,i)=>`<div class="box"><div class="two">${L('Title',I(`s.videos.${i}.title`,v.title))}${L('Duration',I(`s.videos.${i}.duration`,v.duration,'01:05'))}</div>${L('YouTube link (thumbnail is automatic)',`<input data-b="s.videos.${i}.yt" data-yt="1" value="${v.yt?'https://youtu.be/'+v.yt:''}" placeholder="https://youtu.be/…">`)}${L('Other link, if not YouTube (optional)',I(`s.videos.${i}.link`,v.link))}${Lc('Custom thumbnail (16:9, overrides the YouTube one)',img(v.image,'vt',i))}<div><button data-a="vmv" data-i="${i}" data-d="-1">↑</button><button data-a="vmv" data-i="${i}" data-d="1">↓</button><button data-a="vdel" data-i="${i}" class="dng">Delete video</button></div></div>`).join('')}


const setp=(p,v)=>{const a=p.split('.'),k=a.pop();let o=D.site;a.forEach(x=>o=o[x]);o[k]=v};
const FI=(k,v,ph='')=>`<input data-b="${k}" value="${E(v)}" placeholder="${ph}">`,FT=(k,v,r=4)=>`<textarea data-b="${k}" rows="${r}">${E(v)}</textarea>`,FA=(k,v)=>`<textarea data-b="${k}" data-l="1" rows="5">${E((v||[]).join('\n'))}</textarea>`,FL=(t,x)=>`<label>${t}${x}</label>`,FC=(t,x)=>`<div class="lc"><b>${t}</b>${x}</div>`,
FK=(path,key)=>`<div class="cov">${path?`<img src="${E(src(path))}" style="object-fit:contain">`:'<span>Default / none</span>'}<div><button data-a="cov" data-t="k:${key}">Upload image</button><button data-a="lib" data-mode="k:${key}" data-i="0">From library</button>${path?`<button data-a="covx" data-t="k:${key}">Remove</button>`:''}</div></div>`;
function aboutEd(){const a=D.site.about,s='s.about.';$('#ed').innerHTML=`<div class="tb"><b>About page</b><span class="sp"></span><a href="about.html" target="_blank">Preview live</a></div>`
+`<h4>Intro</h4>`+FL('Title',FI(s+'title',a.title))+FL('Lead line',FI(s+'lead',a.lead))+FL('Text (blank line = new paragraph)',FT(s+'text',a.text,6))+FC('Portrait (transparent PNG, about 540×400)',FK(a.image,'about.image'))
+`<h4>Photo strip <small class="hint">(small photos under the intro, 400×300)</small></h4>`+mb(a.photos,'ap',0)
+`<h4>Two-column section</h4><div class="two">`+FL('Left title',FI(s+'split.leftTitle',a.split.leftTitle))+FL('Right title',FI(s+'split.rightTitle',a.split.rightTitle))+FL('Left items (one per line)',FA(s+'split.leftItems',a.split.leftItems))+FL('Right items (one per line)',FA(s+'split.rightItems',a.split.rightItems))+`</div>`+FC('Centre graphic (PNG, about 380×380)',FK(a.split.image,'about.split.image'))
+`<h4>Facts</h4>`+FL('Title',FI(s+'facts.title',a.facts.title))+FL('Items (one per line)',FA(s+'facts.items',a.facts.items))+FC('Image (transparent PNG, about 520×440)',FK(a.facts.image,'about.facts.image'))
+`<h4>Skills chart<button data-a="skadd">+ Skill</button></h4>`+FL('Title',FI(s+'skills.title',a.skills.title))+a.skills.items.map((k,i)=>`<div class="box"><div class="two">${FL('Label',FI(`${s}skills.items.${i}.label`,k.label))}${FL('Percent (0 to 100)',FI(`${s}skills.items.${i}.value`,k.value))}</div>${FL('Colour',`<input type="color" data-b="${s}skills.items.${i}.color" value="${E(k.color)}">`)}<div><button data-a="skdel" data-i="${i}" class="dng">Delete</button></div></div>`).join('')
+`<h4>Feature rows<button data-a="radd">+ Row</button></h4>`+a.rows.map((r,i)=>`<div class="box">${FL('Title',FI(`${s}rows.${i}.title`,r.title))}${FL('Text',FT(`${s}rows.${i}.text`,r.text))}<div class="two">${FL('Link text',FI(`${s}rows.${i}.link`,r.link))}${FL('Link address',FI(`${s}rows.${i}.url`,r.url))}</div>${FC('Image (about 560×400)',FK(r.image,`about.rows.${i}.image`))}<div><button data-a="rmv" data-i="${i}" data-d="-1">↑</button><button data-a="rmv" data-i="${i}" data-d="1">↓</button><button data-a="rdel" data-i="${i}" class="dng">Delete row</button></div></div>`).join('');bindDrops()}
function contactEd(){const c=D.site.contact,s='s.contact.';$('#ed').innerHTML=`<div class="tb"><b>Contact page</b><span class="sp"></span><a href="contact.html" target="_blank">Preview live</a></div>`
+FL('Title',FI(s+'title',c.title))+FL('Lead line',FI(s+'lead',c.lead))+FL('Text',FT(s+'text',c.text))+FC('Portrait (transparent PNG, about 540×400)',FK(c.image,'contact.image'))
+`<h4>Details shown on the page</h4><div class="two">`+FL('Email (also receives messages if no form service is set)',FI(s+'email',c.email))+FL('Phone',FI(s+'phone',c.phone))+`</div>`+FL('Address',FI(s+'address',c.address))
+`<h4>Contact form</h4>`+FL('Form service address (optional)',FI(s+'endpoint',c.endpoint,'https://formspree.io/f/xxxxxxx'))+`<p class="hint">Create a free form at formspree.io (or a similar service) and paste its address. Leave empty to open the visitor's email app instead.</p>`+FL('Message after sending',FI(s+'success',c.success))+`<p class="hint">Social links come from the Home page settings.</p>`}
function tree(){const f=$('#flt').value.toLowerCase();
$('#tree').innerHTML=`<div class="cat${sel.c===-2?' on':''}" data-a="go" data-c="-2" data-p="-1">Home page</div><div class="cat${sel.c===-3?' on':''}" data-a="go" data-c="-3" data-p="-1">About page</div><div class="cat${sel.c===-4?' on':''}" data-a="go" data-c="-4" data-p="-1">Contact page</div><div class="cat${sel.c===-5?' on':''}" data-a="go" data-c="-5" data-p="-1">Sliders</div>`+G.map(([g,n])=>`<h3>${n}<button data-a="addc" data-g="${g}">+ Category</button></h3>`+D.categories.map((c,ci)=>[c,ci]).filter(([c])=>c.group===g).map(([c,ci])=>{
const ps=c.projects.map((p,pi)=>[p.ref?(Object.assign({},(fp(p.ref)||{}).p||{title:'(missing project)'},{ref:p.ref})):p,pi]).filter(([p])=>!f||(p.title+c.title).toLowerCase().includes(f));if(f&&!ps.length)return'';
return `<div class="cat${sel.c===ci&&sel.p<0?' on':''}" data-a="go" data-c="${ci}" data-p="-1">${E(c.title)}</div>`+ps.map(([p,pi])=>`<div class="prj${sel.c===ci&&sel.p===pi?' on':''}" data-a="go" data-c="${ci}" data-p="${pi}">${p.ref?'🔗 ':''}${E(p.title)}</div>`).join('')}).join('')).join('')}

function edit(){const c=C(),p=P(),ed=$('#ed');
if(sel.c<-1){sel.c===-2?home():sel.c===-3?aboutEd():sel.c===-4?contactEd():sliderEd();if(sel.c>-5)$('#ed').insertAdjacentHTML('beforeend',slotsEd(sel.c));return}
if(!c){ed.innerHTML='<p class="hint">Pick a category on the left, or add one with “+ Category”.</p>';return}
const L=(t,x)=>`<label>${t}${x}</label>`,I=(k,v,ph='')=>`<input data-b="${k}" value="${E(v)}" placeholder="${ph}">`,T=(k,v,r=3)=>`<textarea data-b="${k}" rows="${r}">${E(v)}</textarea>`,
cov=(path,t)=>`<div class="cov">${path?`<img src="${E(src(path))}">`:'<span>No image yet</span>'}<div><button data-a="cov" data-t="${t}">Upload image (auto-cropped to 16:9)</button><button data-a="lib" data-mode="${t}" data-i="0">From library</button>${path?`<button data-a="covx" data-t="${t}">Remove</button>`:''}</div></div>`;

async function gh(path,opt={}){const h={Accept:'application/vnd.github+json','Content-Type':'application/json'};if(cfg.token)h.Authorization='Bearer '+cfg.token;
const r=await fetch(`https://api.github.com/repos/${cfg.repo}/${path}`,{...opt,headers:h});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,140));return r.json()}
async function load(){try{msg('Loading…');const f=await gh(`contents/data.json?ref=${cfg.branch}`);D=JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,'')))));
if(localStorage.draft&&confirm('Restore your unpublished draft from last session?'))D=JSON.parse(localStorage.draft);mig();sel={c:-1,p:-1};tree();edit();msg('Loaded from GitHub')}catch(e){msg('Load failed: '+e.message,1)}}
let pubBusy=0;
async function publish(){if(pubBusy)return;if(!cfg.token)return $('#dlg').showModal();
if(D.categories.some(c=>!c.title.trim()||c.projects.some(p=>!p.ref&&!(p.title||'').trim())))return alert('Every category and project needs a title.');
pubBusy=1;$('#pb').disabled=true;
try{msg('Publishing…');const js=JSON.stringify(D),use=Object.keys(pend).filter(k=>!pend[k].done&&js.includes(k)),items=[];
for(const k of use){const b=await gh('git/blobs',{method:'POST',body:JSON.stringify({content:pend[k].b64,encoding:'base64'})});items.push({path:k,mode:'100644',type:'blob',sha:b.sha});msg(`Uploading ${items.length}/${use.length}…`)}
items.push({path:'data.json',mode:'100644',type:'blob',content:JSON.stringify(D,null,2)});
let nc;for(let a=0;;a++){try{
const ref=await gh(`git/ref/heads/${cfg.branch}?t=${Date.now()}`),cm=await gh(`git/commits/${ref.object.sha}`),
full=await gh(`git/trees/${cm.tree.sha}?recursive=1`),
big=(full.tree||[]).filter(x=>x.type==='blob'&&x.size>24*1048576&&!items.some(i=>i.path===x.path)),
t=await gh('git/trees',{method:'POST',body:JSON.stringify({base_tree:cm.tree.sha,tree:items.concat(big.map(x=>({path:x.path,mode:'100644',type:'blob',sha:null})))})}),
n=await gh('git/commits',{method:'POST',body:JSON.stringify({message:'Update portfolio via admin',tree:t.sha,parents:[ref.object.sha]})});
await gh(`git/refs/heads/${cfg.branch}`,{method:'PATCH',body:JSON.stringify({sha:n.sha})});nc=n;if(big.length)alert('These files were over 25 MB, which Cloudflare refuses, so I removed them from the site:\n\n'+big.map(x=>x.path+' ('+(x.size/1048576).toFixed(1)+' MB)').join('\n')+'\n\nCompress them and upload again.');break}
catch(e){if(a<4&&/422|fast.?forward/i.test(e.message)){msg('GitHub was still updating, retrying ('+(a+1)+')…');await new Promise(r=>setTimeout(r,1500*(a+1)));continue}throw e}}
use.forEach(k=>pend[k].done=1);dirty=0;localStorage.removeItem('draft');msg('Published ✔ to '+cfg.repo+' ('+cfg.branch+'), commit '+nc.sha.slice(0,7)+'. The live site updates in about a minute');console.log('Published','https://github.com/'+cfg.repo+'/commit/'+nc.sha);watch(nc.sha)}catch(e){msg('Publish failed: '+e.message,1)}finally{pubBusy=0;$('#pb').disabled=false}}
async function watch(sha){const t0=Date.now();let er=0;
while(Date.now()-t0<240000){await new Promise(r=>setTimeout(r,5000));
try{const cr=await gh(`commits/${sha}/check-runs`),st=await gh(`commits/${sha}/status`),all=[...(cr.check_runs||[]).map(c=>({n:c.name,s:c.status==='completed'?c.conclusion:'pending',d:(c.output&&c.output.summary)||c.conclusion||''})),...(st.statuses||[]).map(c=>({n:c.context,s:c.state,d:c.description||''}))];
if(!all.length){msg('Published ✔ — waiting for Cloudflare to start…');continue}
const bad=all.find(a=>/fail|error|cancel|timed/i.test(a.s)),wait=all.some(a=>/pending|queued|in_progress/i.test(a.s));
if(bad){msg('Published to GitHub, but the website build FAILED ✘ ('+bad.d+')',1);alert('Cloudflare could not deploy this update, so the live site did NOT change.\n\n'+bad.n+': '+bad.d+'\n\nMost likely a file is over 25 MB. Click Publish again: oversized files already in the repo are removed automatically. Then compress that file and upload it again.');return}
if(!wait){msg('Live ✔ The website is updated (hard refresh with Ctrl+Shift+R)');return}
msg('Published ✔ — Cloudflare is building… '+Math.round((Date.now()-t0)/1000)+'s')}catch(e){if(++er>=3){msg('Published ✔ (cannot read build status: give the token Read access to Checks and Commit statuses, or check Cloudflare)',1);return}}}
msg('Published ✔ but the build is taking long. Check the Cloudflare dashboard if the site does not change.',1)}
$('#pb').onclick=publish;addEventListener('error',e=>{try{msg('Error: '+e.message,1)}catch(_){}});
